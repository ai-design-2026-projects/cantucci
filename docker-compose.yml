services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cinepal
      POSTGRES_PASSWORD: cinepal
      POSTGRES_DB: cinepal
    volumes:
      - cinepal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinepal -d cinepal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingest:
    image: ghcr.io/ai-design-2026-projects/cinepal-backend:${CINEPAL_VERSION:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cinepal:cinepal@db:5432/cinepal
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "python -m db.apply && python -m db.ingest"]
    restart: "no"

  backend:
    image: ghcr.io/ai-design-2026-projects/cinepal-backend:${CINEPAL_VERSION:-latest}
    env_file: .env
    environment:
      # Overrides the DATABASE_URL from .env so the container reaches the db
      # service by name rather than localhost.
      DATABASE_URL: postgresql://cinepal:cinepal@db:5432/cinepal
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  frontend:
    image: ghcr.io/ai-design-2026-projects/cinepal-frontend:${CINEPAL_VERSION:-latest}
    depends_on:
      - backend
    ports:
      - "8080:80"

  mcp_server:
    image: ghcr.io/ai-design-2026-projects/cinepal-mcp:${CINEPAL_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/mcp_server/Dockerfile
    environment:
      CINEPAL_MCP_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true
    profiles: ["mcp"]

volumes:
  cinepal-pgdata:
