models:
  # System under test — loaded by get_settings() via CONFIG_PATH=configs/eval.yaml
  strong:
    name: "openai/gpt-4o"
    provider: openrouter
    seed: 42
    max_tokens: 2048
  fast:
    name: "openai/gpt-4o-mini"
    provider: openrouter
    seed: 42
    max_tokens: 512

retrieval:
  top_k: 50
  ivfflat_probes: 10

split:
  mini_size: 500
  eval_frac: 0.10
  seed: 42

representation:
  model: BAAI/bge-large-en-v1.5
  embedding_dim: 1024

clustering:
  base:
    algorithm: hdbscan
    min_cluster_size: 50
    min_samples: 10
    cluster_selection_method: eom
    cluster_selection_epsilon: 0.0
    prob_threshold: 0.01
  online:
    min_cluster_size: 10
  partition_by:
    categorical_top_n: 20

fusion:
  text_weight: 0.6
  review_weight: 0.4
  runtime_weights:
    text: 0.6
    trailer: 0.4

umap:
  # 2D visualization projection
  n_neighbors: 15
  min_dist: 0.1
  # Pre-clustering dimensionality reduction (applied before HDBSCAN)
  clustering_n_components: 50
  clustering_n_neighbors: 15
  clustering_min_dist: 0.0
  clustering_min_dataset_size: 150

labeling:
  top_exemplars: 8

intent:
  confidence_threshold: 0.6

suggestions:
  enabled: true
  similar_pair_distance_max: 0.25
  dominance_fraction: 0.55
  noise_fraction_floor: 0.20
  top_n_signals: 2

conversation:
  cost_limit_usd: 10.0
  max_messages: 100

ingestion:
  hf_repo: "446f6e6e79/CinePal-embeddings"
  artifacts:
    snapshot: snapshots/snapshot_20260522.parquet
    main: embeddings/main_20260522.parquet
    mini: embeddings/mini_20260525.parquet
    # Disjoint holdout slice used exclusively by the eval harness — never ingested into the main DB
    eval_holdout: embeddings/eval_holdout_20260525.parquet

# ---------------------------------------------------------------------------
# Offline eval harness — read by eval/config.py, not by backend/settings.py.
# Changing these values does not affect live conversations.
# ---------------------------------------------------------------------------
eval_harness:
  oracle:
    # LLM used to simulate the human oracle during evaluation sessions.
    name: "google/gemini-2.5-flash"
    provider: openrouter
    seed: 42
    max_tokens: 512
    cost_limit_usd: 2.0   # per-session cost ceiling; session aborts if exceeded
    dry_run: false         # set true to skip real LLM calls (uses fixture responses)

  judge:
    # LLM used to score each conversation across the 7 quality dimensions.
    name: "anthropic/claude-opus-4-7"
    provider: openrouter
    seed: 42
    max_tokens: 1024
    cost_limit_usd: 2.0   # per-conversation cost ceiling
    dry_run: false

  runner:
    max_turns: 15          # oracle turns before the session is force-terminated (finished_budget)
    exemplar_top_k: 5      # max movie titles shown per cluster in oracle prompts
    max_parallel: 10       # max concurrent sessions in a batch run
    run_seed: 0            # seed used when auto-creating a run row

  scorer:
    dimensions:
      - operation_appropriateness   # did the system apply the right operation?
      - label_accuracy              # are cluster labels accurate and clear?
      - clustering_coherence        # do cluster members genuinely belong together?
      - suggestion_meaningfulness   # relevant suggestions? (only when suggestions were offered)
      - explanation_quality         # useful explanations? (only when explain turns occurred)
      - intent_alignment            # does the final clustering match the oracle's stated intent?
      - concept_axis_quality        # coherent concept axes? (only when ≥1 axis was built)
    pole_sample_k: 5       # films sampled from each concept pole for concept_axis_quality
    exemplar_k: 5          # max movie titles shown per cluster in judge prompts

  gt_builder:
    min_ops: 2             # minimum operations in a generated ground-truth trajectory
    max_ops: 4             # maximum operations in a generated ground-truth trajectory
