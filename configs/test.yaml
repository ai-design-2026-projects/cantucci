models:
  strong:
    name: "openrouter/owl-alpha"
    provider: openrouter
    seed: 42
    max_tokens: 1024
    dry_run: true
  fast:
    name: "openrouter/owl-alpha"
    provider: openrouter
    seed: 42
    max_tokens: 512
    dry_run: true

retrieval:
  top_k: 50
  ivfflat_probes: 10

split:
  mini_size: 500
  eval_frac: 0.10
  seed: 42

representation:
  model: BAAI/bge-large-en-v1.5
  embedding_dim: 1024

clustering:
  base:
    algorithm: hdbscan
    min_cluster_size: 50
    min_samples: 10
    cluster_selection_method: eom
    cluster_selection_epsilon: 0.0
    prob_threshold: 0.01
  online:
    drilldown_min_cluster_size: 10
    recut_min_cluster_size: 30
  partition_by:
    categorical_top_n: 20

fusion:
  text_weight: 0.6
  review_weight: 0.4
  runtime_weights:
    text: 0.6
    trailer: 0.4

umap:
  # 2D visualization projection
  n_neighbors: 15
  min_dist: 0.1
  # Pre-clustering dimensionality reduction (applied before HDBSCAN)
  clustering_n_components: 50
  clustering_n_neighbors: 15
  clustering_min_dist: 0.0
  clustering_min_dataset_size: 150

labeling:
  top_exemplars: 8

intent:
  confidence_threshold: 0.6

suggestions:
  enabled: true
  similar_pair_distance_max: 0.25
  dominance_fraction: 0.55
  noise_fraction_floor: 0.20
  top_n_signals: 2

conversation:
  cost_limit_usd: 0.10
  max_messages: 100

eval:
  max_turns: 5
  convergence_turns: 2
  accept_phrases:
    - "perfect"
    - "yes, that's it"
    - "that's exactly"
    - "show me the full list"
    - "accept"
    - "love it"
    - "that works"
    - "you got it"
  judge_dimensions:
    - clustering_coherence
    - question_quality
    - label_accuracy
    - intent_alignment
  judge_model_tier: strong
  silhouette_metric: cosine
  noise_prob_threshold: 0.3

ingestion:
  hf_repo: "446f6e6e79/CinePal-embeddings"
  artifacts:
    snapshot: snapshots/snapshot_20260522.parquet
    main: embeddings/main_20260522.parquet
    mini: embeddings/mini_20260522.parquet
    eval_holdout: embeddings/eval_holdout_20260522.parquet
