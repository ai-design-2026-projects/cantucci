model:
  name: "gpt-4o-mini"
  seed: 42
  max_tokens: 1024

session:
  max_turns: 15
  cost_limit_usd: 5.0
  convergence_turns: 2

retrieval:
  top_k: 50

representation:
  strategy: sentence-transformers/all-MiniLM-L6-v2
  dim: 384

clustering:
  min_cluster_size: 5
  min_samples: 2
  cluster_selection_method: eom
  assignment_threshold: 0.05
  top_titles_per_cluster: 8
  min_singleton_floor: 3
